plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    compileOnly files("libs/26.3/xaerominimap-fabric-26.3-26.6.2.jar")
    compileOnly files("libs/26.3/xaeroworldmap-fabric-26.3-1.47.2.jar")
    compileOnly files("libs/26.3/Origins-Legacy-1.12.20+26.3.jar")
    compileOnly files("libs/26.3/mutantmonsters-v26.3.1-mc26.3.x+fabric.jar")
    compileOnly files("libs/26.3/puzzleslib-v26.3.18-mc26.3.x+fabric.jar")
    compileOnly files("libs/26.3/bettercombat-fabric-3.2.2+26.3.jar")
    compileOnly files("libs/26.3/emf_compat_core_fabric_26.3_2.4.0.jar")
    compileOnly files("libs/26.3/aerialhell-0.7.9_fabric26.3.jar")
    compileOnly files("libs/26.3/entity_model_features-3.3.12-26.3-fabric.jar")
    compileOnly files("libs/26.3/entity_texture_features-7.2.7-26.3-fabric.jar")
    compileOnly files("libs/26.3/lambdynamiclights-4.13.0+26.3.jar")
    compileOnly files("libs/26.3/lambdynamiclights-api-4.13.0+26.3.jar")
    compileOnly files("libs/26.3/particlerain-4.0.3+26.3-fabric.jar")
    compileOnly files("libs/26.3/fabric-carpet-26.3+v260915.jar")
    compileOnly files("libs/26.3/BrewinAndChewin-Fly-4.5.5-fly+26.3.jar")
    compileOnly files("libs/26.3/chat_heads-1.3.2-fabric-26.3.jar")
    compileOnly files("libs/26.3/chatpatches-8.0.0+26.3-fabric.jar")
    compileOnly files("libs/26.3/iris-fabric-1.11.7+mc26.3.jar")
    compileOnly files("libs/26.3/jei-26.3-fabric-31.17.0.113.jar")
    compileOnly files("libs/26.3/RoughlyEnoughItems-26.3.824.jar")
    compileOnly files("libs/26.3/lazy-ai-1.7.2.jar")
    compileOnly files("libs/26.3/rsls-1.4.0.jar")
    compileOnly files("libs/26.3/alexscaves-1.1.3-fabric+26.3.jar")
    compileOnly files("libs/26.3/bubblellaneous-3.0.8.jar")
    compileOnly files("libs/26.3/useless-reptile-0.14.3-26.3.jar")
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "info.mudbourn:mms-render-common:${project.render_common_version}"
    implementation "info.mudbourn:mms-vanity:${project.vanity_version}"
    implementation "info.mudbourn:mms-animation:${project.anim_version}"
    implementation "info.mudbourn:mms-weapons:${project.weapons_version}"
    // Dev client mods that mms-weapons mixins need present
    localRuntime files("libs/26.3/bettercombat-fabric-3.2.2+26.3.jar")
    localRuntime files("libs/26.3/cloth-config-fabric-26.3.159.jar")
    localRuntime files("libs/26.3/runtime/PlayerAnimationLibMerged-1.2.9+mc.26.3.jar")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

processResources {
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Fails the build when a class sits in a mixin package without being a declared mixin.
def checkMixinPackages = tasks.register('checkMixinPackages', Exec) {
    dependsOn tasks.named('jar')
    doFirst {
        commandLine 'python3',
                "$projectDir/gradle/scripts/check-mixin-packages.py",
                tasks.named('jar').get().archiveFile.get().asFile
    }
}

tasks.named('build') { dependsOn checkMixinPackages }

// Unpacks the jar into a class dir HotswapAgent can watch.
tasks.register('hotswapClasses', Copy) {
    dependsOn tasks.named('jar')
    from { zipTree(tasks.named('jar').get().archiveFile) }
    into layout.buildDirectory.dir('hotswap/classes')
    exclude 'META-INF/jars/**'
}
