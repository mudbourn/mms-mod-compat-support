plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.14'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    modImplementation files("libs/absolutrevive-v1.2.1b.jar")
    modCompileOnly files("libs/furnish-31.jar")
    modCompileOnly files("libs/jobsplus-19.1.0-fabric.jar")
    modCompileOnly files("libs/arc-19.1.1-fabric.jar")
    modCompileOnly files("libs/modmetro-v1.jar")
    modCompileOnly files("libs/rubies-1.0.0+1.21.11.jar")
    modCompileOnly files("libs/xaerominimap-fabric-1.21.11-26.4.2.jar")
    modCompileOnly files("libs/mapsyncer-1.0.3-fabric-1.21.11-bugfix.jar")
    modCompileOnly files("libs/Origins-Legacy-1.12.16+1.21.11.jar")
    modCompileOnly files("libs/MutantMonsters-v21.11.2-mc1.21.11-Fabric.jar")
    modCompileOnly files("libs/PuzzlesLib-v21.11.13-mc1.21.11-Fabric.jar")
    modCompileOnly files("libs/expanded_weaponry-0.8.jar")
    // Expanded Weaponry ships Kielson's API as a nested jar; nested jars are not
    // put on the compile classpath, so CustomBow has to be pulled in separately.
    modCompileOnly files("libs/kielsons-api-0.8.1.jar")
    modCompileOnly files("libs/sounds-2.4.23+edge+1.21.11-fabric.jar")
    // Added alongside the v0.9.47 mixins. These jars were committed to libs/ and the
    // classes that import them were committed too, but these declarations were not --
    // build.gradle was already tracked, so the edit missed the commit and the tree
    // could not compile.
    modCompileOnly files("libs/bettercombat-fabric-3.1.0+1.21.11.jar")
    modCompileOnly files("libs/emf_compat_core_1.21.11_1.0.0.jar")
    modCompileOnly files("libs/aerialhell-0.7.7.7_fabric1.21.11.jar")
    modCompileOnly files("libs/frostiful-2.4.0+1.21.11.jar")
    // HeldPoseUnpauseMixin targets EMF's own EMFAnimationEntityContext, not the
    // compat layer, so EMF itself has to be on the compile classpath.
    modCompileOnly files("libs/entity_model_features-3.2.4-1.21.11-fabric.jar")
    // EMF's EMFEntityRenderState#emfEntity() returns an ETF type, and reading the
    // UUID off it therefore needs Entity Texture Features on the classpath too.
    modCompileOnly files("libs/entity_texture_features_1.21.11-fabric-7.1.jar")
    // SandPileGateMixin targets Scorchful's own SandAccumulation class, so the
    // mod has to be on the compile classpath to resolve the tickChunk signature.
    modCompileOnly files("libs/scorchful-0.16.8+1.21.11.jar")
    // NeaHeldItemWhitelistMixin has to name BasicAnimation in its own signature to
    // read which animation is being judged, and the concrete animation classes to
    // decide. NEA was previously reached only through a hand-written intermediary
    // string in NeaSprintMixin, which needs no classpath — this does.
    modCompileOnly files("libs/notenoughanimations-fabric-1.12.4-mc1.21.11.jar")
    modCompileOnly files("libs/emf_compat_not_enough_animations_1.21.11_1.2.0.jar")
    // BiomeMemoMixin redirects a getBiome call inside Particle Rain's own
    // ParticleSpawner, so the mod has to be a loom dependency -- otherwise the
    // redirect descriptor would have to be hand-written in intermediary.
    modCompileOnly files("libs/particlerain-4.0.0-beta.10+1.21.11-fabric.jar")
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"
    modCompileOnly "maven.modrinth:combat-amenities:3.1.7-1.21.11"
    modCompileOnly "maven.modrinth:trinkets-updated:3.11.0-beta.2+1.21.11"
    modCompileOnly "maven.modrinth:cardinal-components-api:7.3.1"
    modCompileOnly files("libs/cardinal-components-base-7.3.1.jar")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

processResources {
    // declare the version as an input so bumping gradle.properties
    // invalidates the task (expand values are not tracked automatically)
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Mixin claims every class under a config's `package` and refuses to load
// anything there as a normal class (IllegalClassLoadError). A plain helper put
// in a mixin package compiles and packages cleanly and only explodes the first
// time it is touched at runtime — which for MetroRailPath in 0.7.0 meant a
// server crash on the first follower-cart tick, in production. Fail the build
// instead.
def checkMixinPackages = tasks.register('checkMixinPackages', Exec) {
    dependsOn tasks.named('remapJar')
    doFirst {
        commandLine 'python3',
                "$projectDir/gradle/scripts/check-mixin-packages.py",
                tasks.named('remapJar').get().archiveFile.get().asFile
    }
}

tasks.named('build') { dependsOn checkMixinPackages }

// Hotswap support for the "MMS Dev" client.
//
// The client runs the pack's mods under intermediary names, but this project
// compiles against Mojmap -- so build/classes/java/main cannot be swapped in
// directly, its references would not resolve. remapJar produces correctly named
// classes, but HotswapAgent watches directories rather than jars, so unpack it.
//
// Driven by mms-pack/mms-hotswap-watch.sh, which runs this under
// `gradlew --continuous`; HotswapAgent's autoHotswap then picks up the rewritten
// class files and redefines them in the running client.
tasks.register('hotswapClasses', Copy) {
    description = 'Unpacks the remapped jar into a class dir HotswapAgent can watch.'
    dependsOn tasks.named('remapJar')
    from { zipTree(tasks.named('remapJar').get().archiveFile) }
    into layout.buildDirectory.dir('hotswap/classes')
    // resources are reloaded by the game, not by class redefinition, and the
    // nested jars would confuse the watcher
    exclude 'META-INF/jars/**'
}
