name: Release

# Manual only. Releasing is deliberate here: the pack pins an exact compat
# version, and a jar whose internal version does not match its tag is the
# "mms-deploy ships nothing" failure mode all over again. See the version
# check below.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.9.50) — must already match mod_version in gradle.properties"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate version against gradle.properties
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [[ ! "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: invalid version '$INPUT'. Expected X.Y.Z"
            exit 1
          fi
          DECLARED=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          if [[ "$INPUT" != "$DECLARED" ]]; then
            echo "ERROR: version mismatch."
            echo "  requested:            $INPUT"
            echo "  gradle.properties:    $DECLARED"
            echo
            echo "Bump mod_version in gradle.properties and commit it first."
            echo "Releasing a jar stamped with a different version than its tag means"
            echo "the pack can pin a version that no built jar actually reports."
            exit 1
          fi
          echo "Version $INPUT confirmed."

      # libs/ is gitignored on purpose: those jars are other projects'
      # redistributables under their own licenses, and several are ARR. They
      # live in a private companion repo so this public MIT repo never carries
      # them and CI can still compile.
      - name: Check out compile-only libraries
        uses: actions/checkout@v4
        with:
          repository: mudbourn/mms-libs
          token: ${{ secrets.MMS_LIBS_TOKEN }}
          path: .mms-libs

      - name: Stage libs/
        run: |
          set -euo pipefail
          mkdir -p libs
          cp .mms-libs/mms-mod-compat-support/*.jar libs/
          echo "Staged $(ls libs | wc -l) jars."

      # Version skew in libs/ surfaces as confusing mixin failures at runtime
      # rather than build errors, so fail loudly and early instead.
      - name: Verify every referenced jar is present
        run: |
          set -euo pipefail
          MISSING=0
          while read -r jar; do
            if [ ! -f "libs/$jar" ]; then
              echo "MISSING: libs/$jar"
              MISSING=1
            fi
          done < <(grep -oE 'files\("libs/[^"]+\.jar"\)' build.gradle \
                   | sed -E 's|files\("libs/||; s|"\)||')
          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "build.gradle references jars that mms-libs does not provide."
            echo "Update the private mms-libs repo to match, versions exactly."
            exit 1
          fi
          echo "All referenced jars present."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          # Loom leaves the unremapped and dev jars alongside the real one.
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-dev-shadow.jar' \
            -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls -A dist)" || { echo "ERROR: no jars produced"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          FLAGS=(--generate-notes --title "mms-mod-compat-support v${VERSION}")
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "v${VERSION}" dist/*.jar \
            --target "${{ github.sha }}" \
            "${FLAGS[@]}"
